<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In • Cash App Lightning Gateway</title>
  <link rel="icon" type="image/svg+xml" href="/assets/cashapp-logo.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #070707;
      color: #EDEDED;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .bg-mesh {
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 214, 50, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 214, 50, 0.05) 0%, transparent 40%);
    }
  </style>
</head>

<body class="min-h-screen bg-mesh flex flex-col justify-between selection:bg-[#00D632] selection:text-black">

  <!-- Header / Navigation Bar -->
  <header class="w-full border-b border-neutral-900/80 bg-[#0A0A0A]/60 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="/" class="flex items-center space-x-3 group">
        <img src="/assets/cashapp-logo.svg" alt="Cash App Logo" class="w-10 h-10 rounded-2xl shadow-lg shadow-emerald-500/20 group-hover:scale-105 transition" />
        <div>
          <div class="text-lg font-extrabold tracking-tight text-white flex items-center space-x-1.5">
            <span>Cash App</span>
            <span class="text-[#00D632]">Pay</span>
            <span class="text-[10px] bg-[#00D632]/10 border border-[#00D632]/30 text-[#00D632] font-mono px-2 py-0.5 rounded-full ml-1">⚡ Lightning</span>
          </div>
          <p class="text-[11px] text-neutral-400 font-medium">Crypto Lightning Payment Gateway</p>
        </div>
      </a>
      <a href="/signup" class="text-xs font-bold text-neutral-300 hover:text-white px-4 py-2 rounded-xl bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 transition">
        Create Account
      </a>
    </div>
  </header>

  <!-- Centered Login Card Container -->
  <main class="flex-grow flex items-center justify-center p-4 sm:p-6 my-8">
    <div class="w-full max-w-md bg-[#121212] border border-neutral-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
      
      <!-- Card Title & Subtitle -->
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-[#00D632]/10 border border-[#00D632]/20 mb-3">
          <svg class="w-6 h-6 text-[#00D632]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
          </svg>
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight">Welcome back</h1>
        <p class="text-xs text-neutral-400 mt-1">Sign in to your Cash App Lightning console</p>
      </div>

      <!-- Server Error Alert Banner -->
      <div id="loginErrorBanner" class="hidden mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 flex items-start space-x-2.5 text-rose-400 text-xs">
        <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" stroke-width="2" />
          <line x1="12" y1="8" x2="12" y2="12" stroke-width="2" />
          <line x1="12" y1="16" x2="12.01" y2="16" stroke-width="2" />
        </svg>
        <span id="loginErrorMsg">Invalid email or password</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">

        <!-- 1. Email Address Field -->
        <div>
          <label for="loginEmail" class="block text-xs font-bold text-neutral-300 mb-1.5">Email Address</label>
          <input 
            type="email" 
            id="loginEmail" 
            placeholder="you@merchant.com" 
            required 
            class="w-full bg-neutral-900 border border-neutral-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-[#00D632] focus:ring-2 focus:ring-[#00D632]/20 transition" 
          />
        </div>

        <!-- 2. Password Field -->
        <div>
          <label for="loginPassword" class="block text-xs font-bold text-neutral-300 mb-1.5">Password</label>
          <input 
            type="password" 
            id="loginPassword" 
            placeholder="••••••••" 
            required 
            class="w-full bg-neutral-900 border border-neutral-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-[#00D632] focus:ring-2 focus:ring-[#00D632]/20 transition" 
          />
        </div>

        <!-- Submit Button with Spinner -->
        <button 
          type="submit" 
          id="loginSubmitBtn"
          class="w-full bg-[#00D632] hover:bg-[#00c02d] text-black font-black py-3.5 rounded-xl text-xs sm:text-sm transition shadow-lg shadow-emerald-500/20 active:scale-98 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center space-x-2 mt-2">
          <span id="loginBtnSpinner" class="hidden">
            <svg class="animate-spin w-4 h-4 text-black" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </span>
          <span id="loginBtnText">Sign In</span>
        </button>

        <!-- Bottom Switch to Sign Up -->
        <div class="pt-4 border-t border-neutral-800 text-center">
          <p class="text-xs text-neutral-400">
            Don't have an account yet? 
            <a href="/signup" class="text-[#00D632] font-bold hover:underline ml-1">Create Account</a>
          </p>
        </div>

      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-neutral-900 py-6 text-center text-xs text-neutral-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between space-y-2 sm:space-y-0">
      <p>© 2026 Cash App Lightning Gateway. All rights reserved.</p>
      <div class="flex space-x-4">
        <a href="/terms" class="hover:text-white transition">Terms & Conditions</a>
        <a href="/signup" class="hover:text-white transition">Create Account</a>
      </div>
    </div>
  </footer>

  <script>
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const banner = document.getElementById("loginErrorBanner");
      const bannerMsg = document.getElementById("loginErrorMsg");
      banner.classList.add("hidden");

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      const submitBtn = document.getElementById("loginSubmitBtn");
      const spinner = document.getElementById("loginBtnSpinner");
      const btnText = document.getElementById("loginBtnText");

      submitBtn.disabled = true;
      spinner.classList.remove("hidden");
      btnText.innerText = "Signing In...";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem("cashapp_auth_token", data.token);
          window.location.href = data.redirect || (['owner', 'admin', 'support'].includes(data.user.role) ? "/admin" : "/profile");
        } else {
          bannerMsg.innerText = data.error || "Invalid email or password";
          banner.classList.remove("hidden");
        }
      } catch (err) {
        bannerMsg.innerText = "Network error during sign in. Please try again.";
        banner.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add("hidden");
        btnText.innerText = "Sign In";
      }
    }
  </script>
</body>

</html>
